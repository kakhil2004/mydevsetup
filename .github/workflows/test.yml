name: test-install

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: bash install.sh
      - name: Install again (must be idempotent)
        run: bash install.sh
      - name: Verify
        run: bash tests/verify.sh

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # a bare image, so nothing preinstalled on GitHub's runner hides a missing step
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: bash install.sh
      - name: Install again (must be idempotent)
        run: bash install.sh
      - name: Verify
        run: bash tests/verify.sh
